{% extends "base.html" %}

{% block title %}My Orders & Live Tracking - CampusBite{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">My Orders & Live Tracking</h2>
            <p class="text-muted small mb-0">Follow your order lifecycle from kitchen prep to collection.</p>
        </div>
        <button class="btn btn-outline-success btn-sm rounded-pill fw-bold" onclick="fetchMyOrders()">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh Status
        </button>
    </div>

    <div id="ordersContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="text-muted small mt-2">Loading your orders...</p>
        </div>
    </div>
</div>

<script>
async function fetchMyOrders() {
    const container = document.getElementById('ordersContainer');
    try {
        const res = await fetch('/api/orders/my-orders');
        const data = await res.json();
        if (data.success) {
            renderOrders(data.orders);
        }
    } catch (e) {
        container.innerHTML = `
            <div class="campus-card text-center py-5">
                <i class="bi bi-exclamation-circle text-danger fs-1"></i>
                <h5 class="fw-bold mt-2">Unable to load orders</h5>
                <p class="text-muted">Please check your connection and retry.</p>
            </div>
        `;
    }
}

function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    if (!orders || orders.length === 0) {
        container.innerHTML = `
            <div class="campus-card text-center py-5">
                <div class="text-muted mb-3"><i class="bi bi-clock-history fs-1"></i></div>
                <h5 class="fw-bold">No orders placed yet</h5>
                <p class="text-muted small">Hungry? Discover mouth-watering dishes in our campus menu.</p>
                <a href="/student/dashboard" class="btn btn-campus-primary rounded-pill px-4 mt-2">
                    <i class="bi bi-compass me-1"></i> Go to Menu
                </a>
            </div>
        `;
        return;
    }

    const stepMap = {
        'CONFIRMED': 1,
        'PREPARING': 2,
        'READY_FOR_PICKUP': 3,
        'COLLECTED': 4,
        'CANCELLED': 0
    };

    container.innerHTML = orders.map(ord => {
        const step = stepMap[ord.order_status] || 1;
        const isCancelled = ord.order_status === 'CANCELLED';
        const isReady = ord.order_status === 'READY_FOR_PICKUP';

        let progressHtml = '';
        if (isCancelled) {
            progressHtml = `
                <div class="alert alert-danger py-2 px-3 small rounded-pill d-inline-flex align-items-center mb-0">
                    <i class="bi bi-x-circle-fill me-2"></i> This order was cancelled. Stock has been restored.
                </div>
            `;
        } else {
            progressHtml = `
                <div class="d-flex align-items-center justify-content-between position-relative my-3 px-2">
                    <div class="text-center" style="z-index: 2;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 ${step >= 1 ? 'bg-primary text-white' : 'bg-light text-muted'}" style="width: 34px; height: 34px;">
                            <i class="bi bi-receipt"></i>
                        </div>
                        <span class="small fw-bold ${step >= 1 ? 'text-primary' : 'text-muted'}" style="font-size: 0.75rem;">Confirmed</span>
                    </div>

                    <div class="flex-grow-1 border-top border-2 mx-1 ${step >= 2 ? 'border-warning' : 'border-light'}"></div>

                    <div class="text-center" style="z-index: 2;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 ${step >= 2 ? 'bg-warning text-white' : 'bg-light text-muted'}" style="width: 34px; height: 34px;">
                            <i class="bi bi-fire"></i>
                        </div>
                        <span class="small fw-bold ${step >= 2 ? 'text-warning' : 'text-muted'}" style="font-size: 0.75rem;">Preparing</span>
                    </div>

                    <div class="flex-grow-1 border-top border-2 mx-1 ${step >= 3 ? 'border-success' : 'border-light'}"></div>

                    <div class="text-center" style="z-index: 2;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 ${step >= 3 ? 'bg-success text-white' : 'bg-light text-muted'}" style="width: 34px; height: 34px;">
                            <i class="bi bi-bell-fill"></i>
                        </div>
                        <span class="small fw-bold ${step >= 3 ? 'text-success' : 'text-muted'}" style="font-size: 0.75rem;">Ready</span>
                    </div>

                    <div class="flex-grow-1 border-top border-2 mx-1 ${step >= 4 ? 'border-secondary' : 'border-light'}"></div>

                    <div class="text-center" style="z-index: 2;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 ${step >= 4 ? 'bg-secondary text-white' : 'bg-light text-muted'}" style="width: 34px; height: 34px;">
                            <i class="bi bi-check2-all"></i>
                        </div>
                        <span class="small fw-bold ${step >= 4 ? 'text-secondary' : 'text-muted'}" style="font-size: 0.75rem;">Collected</span>
                    </div>
                </div>
            `;
        }

        const itemsSummary = (ord.items || []).map(i => `${i.food_name} &times; ${i.quantity}`).join(', ');

        return `
            <div class="campus-card mb-4 border ${isReady ? 'border-success border-2 shadow' : ''}">
                <div class="d-flex flex-wrap justify-content-between align-items-center pb-2 border-bottom gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="bill-badge">${ord.bill_no}</span>
                        <span class="status-badge status-${ord.order_status}">${ord.order_status.replace(/_/g, ' ')}</span>
                        ${isReady ? '<span class="badge bg-success rounded-pill animate-pulse">🔥 READY FOR PICKUP NOW!</span>' : ''}
                    </div>
                    <div class="text-muted small">
                        <i class="bi bi-clock me-1"></i>${ord.created_at}
                    </div>
                </div>

                <div class="row align-items-center my-3">
                    <div class="col-md-5 text-center text-md-start mb-3 mb-md-0">
                        <div class="small text-muted fw-bold">PICKUP TOKEN</div>
                        <div class="token-badge-lg my-1">${ord.token_no}</div>
                        <div class="small text-muted">Show this token at the food collection counter</div>
                    </div>

                    <div class="col-md-7">
                        ${progressHtml}
                    </div>
                </div>

                <div class="bg-light p-3 rounded-3 d-flex flex-wrap justify-content-between align-items-center gap-2 border">
                    <div>
                        <div class="small fw-bold text-dark mb-1">Items: <span class="text-muted fw-normal">${itemsSummary}</span></div>
                        <div class="small text-muted">
                            Payment: <strong class="text-dark">${ord.payment_method}</strong> &bull; 
                            Status: <span class="badge ${ord.payment_status === 'PAID' ? 'bg-success' : 'bg-warning text-dark'}">${ord.payment_status}</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="text-end">
                            <span class="small text-muted d-block">Grand Total</span>
                            <span class="fs-5 fw-extrabold text-success">₹${ord.total_amount.toFixed(2)}</span>
                        </div>
                        ${ord.order_status === 'CONFIRMED' ? `
                            <button class="btn btn-sm btn-outline-danger rounded-pill fw-bold" onclick="cancelOrder(${ord.id})">
                                Cancel Order
                            </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

async function cancelOrder(orderId) {
    if (!confirm('Are you sure you want to cancel this order? It will restore the food court stock.')) return;
    try {
        const res = await fetch(`/api/orders/cancel/${orderId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            Cart.showToast('Order cancelled successfully.', 'success');
            fetchMyOrders();
        } else {
            alert(data.error);
        }
    } catch (e) {
        alert('Cancellation error: ' + e);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    fetchMyOrders();
    setInterval(fetchMyOrders, 5000);
});
</script>
{% endblock %}
